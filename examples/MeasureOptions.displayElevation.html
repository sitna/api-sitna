<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>SITNA - Ejemplo de MeasureOptions.displayElevation</title>
    <link rel="stylesheet" href="examples.css" />
</head>
<body>
    <div class="instructions">
        <p>Ejemplo de uso de <a href="../doc/MeasureOptions.html">MeasureOptions</a>.displayElevation.</p>
        <p>Control de dibujo de geometrías que se puede utilizar para medir distancias, áreas, coordenadas y elevaciones.</p>
    </div>
    <script src="../"></script>
    <script type="text/javascript" src="examples.js"></script>

    <div id="my-map"></div>
    <script>
        const myMap = new SITNA.Map("my-map", {
            // Establecemos un layout simplificado apto para hacer demostraciones de controles.
            layout: "layout/ctl-container",
            controls: {
                // Añadimos el control de dibujo, medida y modificación de geometrías en el primer contenedor.
                drawMeasureModify: {
                    div: "slot1",
                    displayElevation: { // Se mostrarán elevaciones en los resultados de medida
                        sampleNumber: 100 // se mostrará el perfil mediante 100 puntos equiespaciados a lo largo de la línea
                    }
                }
            }
        });
    </script>
	
</body>
</html>
