<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>SITNA - Ejemplo de uso del control LayerComparer con dos mapas secundarios</title>
    <link rel="stylesheet" href="examples.css" />
</head>
<body>
    <div class="instructions">
        <p>
            Ejemplo de uso del control <a href="../doc/SITNA.control.LayerComparer.html">LayerComparer</a> con dos mapas secundarios.
        </p>
    </div>
    <script src="../"></script>
    <script type="text/javascript" src="examples.js"></script>
    <div id="my-map"></div>
    <script>
        // Creamos un mapa con un control LayerComparer configurado para tener dos mapas secundarios.
        const myMap = new SITNA.Map("my-map", {
            layout: "layout/ctl-container",
            controls: {
                layerComparer: {
                    div: "slot1",
                    secondaryMapCount: 2,
                    view: SITNA.control.LayerComparer.view.SPLIT,
                    availableViews: [
                        SITNA.control.LayerComparer.view.SPLIT,
                        SITNA.control.LayerComparer.view.TRANSPARENCY
                    ],
                    secondaryBaseLayers: [
                        SITNA.Consts.layer.IDENA_ORTHOPHOTO,
                        SITNA.Consts.layer.IDENA_ORTHOPHOTO2012
                    ]
                }
            }
        });
    </script>
</body>
</html>
