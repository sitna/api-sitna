
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sandbox</title>
    <meta charset="UTF-8">
    <script src="bundle.js"></script>
    <style>
        @font-face {
            font-family: 'FontAwesome';
            src: url('../layout/responsive/fonts/fontawesome-webfont.eot?v=4.5.0');
            src: url('../layout/responsive/fonts/fontawesome-webfont.eot?#iefix&v=4.5.0') format('embedded-opentype'), url('../layout/responsive/fonts/fontawesome-webfont.woff?v=4.5.0') format('woff'), url('../layout/responsive/fonts/fontawesome-webfont.ttf?v=4.5.0') format('truetype'), url('../layout/responsive/fonts/fontawesome-webfont.svg?v=4.5.0#fontawesomeregular') format('svg');
            font-weight: normal;
            font-style: normal;
        }

        html, body, .cm-editor, #codeEditor {
            height: 100%;
        }

        body {
            margin: 0;
        }

        #codeEditor {
            width: 50%;
            position: absolute;
            float: left;
            display: flex;
            flex-wrap: wrap;
            background-color: #fff;
            animation-name: uncollapse;
            animation-duration: 1s;
            left: 0%;
        }

        @keyframes collapse {
            from {
                left: 0%;
            }

            to {
                left: -100%;
            }
        }

        @keyframes uncollapse {
            from {
                left: -100%;
            }

            to {
                left: 0%;
            }
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.3);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.3);
            }

            40% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        #codeEditor.collapsed {
            animation-name: collapse;
            animation-duration: 1s;
            left: -100%;
        }


        #codeViewer {
            width: 100%;
            height: 100%;
            float: left;
            padding: 0;
            margin: 0;
            border: 0;
        }

            #codeViewer * {
                height: 100%;
                margin: 0;
                padding: 0;
                margin: 0;
                overflow: hidden;
            }

        #command {
            height: 2em;
            /* width: 100%; */
            background-color: #000;
            flex-basis: 100%;
        }

        #codeEditorBox {
            flex-basis: 100%;
            height: calc(100% - 2em);
            overflow: auto;
            border-right: 2px solid #000;
        }


        button {
            background-color: transparent;
            width: 2em;
            height: 2em;
            margin: 3px;
            padding: 0;
            float: right;
            border: 0;
        }

            button::before {
                font-family: FontAwesome;
                font-size: 1.5em;
                cursor: pointer;
                color: #FFE;
                line-height: 1.4em;
            }

            button.close::before {
                content: "\f00d";
            }

            button.new-window::before {
                content: "\f08e";
            }

            button.collapse::before {
                content: "\f053";
            }


            button.play::before {
                content: "\f04b";
            }
            button.copy::before {
                content: "\f0c5";
            }
            button.copy.copied:after {
                font-weight: normal;
                font-style: normal;
                text-shadow: none;
                border-radius: 2px;
                color: #fff;
                /* border-radius: var(--balloon-border-radius); */
                content: attr(title);
                padding: .5em 1em;
                position: absolute;
                white-space: nowrap;
                z-index: 10;
                transform: translate(-50%, 2.5em);
                background-color: #000;
            }
            #codeEditor.collapsed button.collapse {
                left: -3px;
                position: fixed;
                background-color: #000;
                top: -3px;
                border: 1px solid #fff;
            }

            #codeEditor.collapsed button.collapse::before {
                content: "\f054";
            }
            button.play.changed::before {
                color: #e5eb18;
            }

            button.play.changed {
                animation: pulse 3s infinite;
            }
        
    </style>
</head>
<body>

    <div id="codeEditor">
        <div id="command">
            <button title="Replegar" class="collapse"></button>
            <button class="copy"  title="Copiar al portapapeles"></button>
            <button title="Aplicar cambios" class="play"></button>
        </div>
        <div id="codeEditorBox"></div>
    </div>
    <div id="codeViewer">
        <div></div>
    </div>   
</body>
</html>
